<div id="rings" style="display:flex;justify-content:space-around;align-items:flex-start;padding:8px;background:#0a0a0a;width:100%;min-height:160px;box-sizing:border-box">
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
    <svg width="64" height="64" viewBox="0 0 80 80">
      <circle cx="40" cy="40" r="32" fill="none" stroke="#2a2a2a" stroke-width="6" transform="rotate(-90 40 40)"/>
      <circle id="weekArc" cx="40" cy="40" r="32" fill="none" stroke="#39FF14" stroke-width="6" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="150" transform="rotate(-90 40 40)"/>
      <text id="weekVal" x="40" y="37" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="500" font-family="sans-serif">Wk 1</text>
      <text id="weekSub" x="40" y="51" text-anchor="middle" fill="#666666" font-size="10" font-family="sans-serif">of 8</text>
    </svg>
    <span style="font-size:10px;color:#666666;font-family:sans-serif">Block progress</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
    <svg width="64" height="64" viewBox="0 0 80 80">
      <circle cx="40" cy="40" r="32" fill="none" stroke="#2a2a2a" stroke-width="6" transform="rotate(-90 40 40)"/>
      <circle id="conArc" cx="40" cy="40" r="32" fill="none" stroke="#39FF14" stroke-width="6" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="201" transform="rotate(-90 40 40)"/>
      <text id="conVal" x="40" y="37" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="500" font-family="sans-serif">0/12</text>
      <text x="40" y="51" text-anchor="middle" fill="#666666" font-size="10" font-family="sans-serif">done</text>
    </svg>
    <span style="font-size:10px;color:#666666;font-family:sans-serif">Consistency</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
    <svg width="64" height="64" viewBox="0 0 80 80">
      <circle cx="40" cy="40" r="32" fill="none" stroke="#2a2a2a" stroke-width="6" transform="rotate(-90 40 40)"/>
      <circle id="trendArc" cx="40" cy="40" r="32" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="100" transform="rotate(-90 40 40)"/>
      <text id="trendArrow" x="40" y="37" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="500" font-family="sans-serif">→</text>
      <text id="trendWord" x="40" y="52" text-anchor="middle" fill="#666666" font-size="10" font-family="sans-serif">Holding</text>
    </svg>
    <span style="font-size:10px;color:#666666;font-family:sans-serif">Trend</span>
  </div>
</div>
<script>
(function() {
  function getParam(name) {
    try {
      return new URLSearchParams(window.location.search).get(name) || '0';
    } catch(e) { return '0'; }
  }

  function init() {
    var week = parseInt(getParam('week')) || 1;
    var totalWeeks = parseInt(getParam('total_weeks')) || 8;
    var completed = parseInt(getParam('completed')) || 0;
    var expected = parseInt(getParam('expected')) || 12;
    var trend = getParam('trend').toLowerCase();

    var weekOffset = 201 - (201 * (week / totalWeeks));
    var conOffset = expected > 0 ? 201 - (201 * (completed / expected)) : 201;
    var trendColor = trend === 'increase' ? '#39FF14' : trend === 'decrease' ? '#FF6B35' : '#ffffff';
    var trendArrow = trend === 'increase' ? '\u2191' : trend === 'decrease' ? '\u2193' : '\u2192';
    var trendWord = trend === 'increase' ? 'Increasing' : trend === 'decrease' ? 'Decreasing' : 'Holding';
    var trendOffset = trend === 'increase' ? 50 : trend === 'decrease' ? 150 : 100;

    var weekArc = document.getElementById('weekArc');
    var weekVal = document.getElementById('weekVal');
    var weekSub = document.getElementById('weekSub');
    var conArc = document.getElementById('conArc');
    var conVal = document.getElementById('conVal');
    var trendArc = document.getElementById('trendArc');
    var trendArrowEl = document.getElementById('trendArrow');
    var trendWordEl = document.getElementById('trendWord');

    if(weekArc) weekArc.setAttribute('stroke-dashoffset', weekOffset);
    if(weekVal) weekVal.textContent = 'Wk ' + week;
    if(weekSub) weekSub.textContent = 'of ' + totalWeeks;
    if(conArc) conArc.setAttribute('stroke-dashoffset', conOffset);
    if(conVal) conVal.textContent = completed + '/' + expected;
    if(trendArc) { trendArc.setAttribute('stroke-dashoffset', trendOffset); trendArc.setAttribute('stroke', trendColor); }
    if(trendArrowEl) { trendArrowEl.textContent = trendArrow; trendArrowEl.setAttribute('fill', trendColor); }
    if(trendWordEl) trendWordEl.textContent = trendWord;
  }

  if(document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
